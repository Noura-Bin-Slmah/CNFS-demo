services:
  - type: web
    name: cnfs-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python frontend_server.py
    envVars:
      - key: CNFS_HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
